<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<style>
/* 入口。今はドリルへの入り口だけ（ゲームは設計中） */
.wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; display: grid; gap: 18px; }
h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; }
a.door { display: grid; gap: 4px; text-decoration: none; color: var(--ink); background: var(--sheet); border: 2px solid var(--rule); border-left: 8px solid var(--c); border-radius: var(--radius); padding: 18px 20px; }
a.door b { font-family: var(--font-display); font-size: 1.4rem; color: var(--c); }
a.door:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Brain Dungeon</h1>
  <a class="door" href="drill.html" data-s="math">
    <b>知恵の試練</b>
    <span class="muted">今日の4問を解く</span>
  </a>
</div>
</body>
</html>
