<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Brain Dungeon</title>
<!-- 新しい版を出すときは、下の ?v= の数字をすべて1つ上げる（iPad が古いファイルを使い続けないように。GitHub Pages は10分ほどファイルを覚えさせる） -->
<link rel="stylesheet" href="css/game.css?v=15">
</head>
<body>
<div id="stage">
  <canvas id="screen" aria-label="ゲームの画面"></canvas>

  <!-- iPad 用のボタン（タッチできる端末だけ表示） -->
  <div id="touch" hidden>
    <div id="dpad" aria-label="十字キー">
      <div class="dpad-arrow up"></div>
      <div class="dpad-arrow down"></div>
      <div class="dpad-arrow left"></div>
      <div class="dpad-arrow right"></div>
      <div id="dpadKnob"></div>
    </div>
    <div id="buttons">
      <button type="button" class="btn skill" data-act="skill1">スキル1</button>
      <button type="button" class="btn skill" data-act="skill2">スキル2</button>
      <button type="button" class="btn skill" data-act="skill3">スキル3</button>
      <button type="button" class="btn attack" data-act="attack">攻撃</button>
      <button type="button" class="btn small" data-act="switch">切替</button>
    </div>
    <button type="button" id="menuBtn" class="btn small" data-act="menu">メニュー</button>
  </div>

  <div id="rotate" hidden>
    <p>iPad を横向きにしてね</p>
  </div>

  <div id="pause" hidden>
    <div class="panel">
      <h2>一時停止</h2>
      <p>メニューを開いているあいだは、敵も時間も止まります。</p>
      <button type="button" id="resumeBtn" class="btn">つづける</button>
      <div class="toolbox">
        <h3>道具</h3>
        <div id="toolList" class="tool-list"></div>
        <p id="toolNote" class="note"></p>
      </div>
      <div class="mapbox">
        <h3>地図</h3>
        <canvas id="bigMap"></canvas>
        <p class="note"><span class="key cur"></span>いまいる部屋　<span class="key start"></span>入口　<span class="key exit"></span>出口　<span class="key seen"></span>通った部屋</p>
        <p class="note"><span class="key dot keyitem"></span>鍵　<span class="key dot chest"></span>宝箱　<span class="key dot trap"></span>見つけた罠　<span class="key locked"></span>鍵のかかった扉</p>
        <p id="floorInfo" class="note"></p>
        <p id="chestInfo" class="note"></p>
      </div>
    </div>
  </div>

  <!-- 段階5-2①：拠点のメニュー（装備・倉庫・お店・鍛冶屋） -->
  <div id="town" class="screen town" hidden>
    <div class="panel wide-panel">
      <div class="town-head">
        <button type="button" id="townBack" class="btn small-btn">← 拠点にもどる</button>
        <h2 id="townTitle"></h2>
      </div>
      <p id="townMoney" class="money"></p>
      <p id="townNote" class="note town-note"></p>
      <div id="townBody"></div>
    </div>
  </div>

  <!-- 段階5-1：キャラクリ -->
  <div id="create" class="screen" hidden>
    <div class="panel wide-panel">
      <h2>仲間を3人つくろう</h2>
      <p>名前・職業・顔を選んでね。</p>
      <div id="createList" class="cc-list"></div>
      <p id="createNote" class="note"></p>
      <button type="button" id="createGo" class="btn big">冒険をはじめる</button>
    </div>
  </div>

  <!-- 段階5-1：拠点 -->
  <div id="base" class="screen town" hidden>
    <div class="panel wide-panel">
      <h2>森の拠点</h2>
      <p id="baseMoney" class="money"></p>
      <div id="baseReport" class="report" hidden></div>
      <div class="town-wrap"><canvas id="townMap" aria-label="町の地図。建物を押すと開く"></canvas></div>
      <p class="note town-hint">建物を押すと開くよ。森の門から出発！</p>
      <div id="departBox" class="depart">
        <button type="button" id="goNext" class="btn big">出発</button>
        <span class="again">前の階層にもう一度 <select id="goAgainFloor"></select> <button type="button" id="goAgain" class="btn">出発</button></span>
      </div>
      <div id="baseParty" class="party"></div>
      <p id="baseNote" class="note"></p>
      <details class="test">
        <summary>テスト用の設定（保護者むけ）</summary>
        <div class="test-foot">
          <label>知恵の試練の正解数（仮） <select id="testCorrect"></select></label>
          <label>冒険の時間 <select id="testMinutes"></select></label>
          <label>seed <input id="testSeed" type="text" inputmode="numeric" placeholder="空なら毎回ちがう" size="10"></label>
        </div>
        <div class="test-foot">
          <label>3人のレベル <select id="testLevel"></select></label>
          <button type="button" id="testLevelApply" class="btn">このレベルにする</button>
        </div>
        <div class="test-foot">
          <label>好きな階層 <select id="testFloor"></select></label>
          <button type="button" id="testGo" class="btn">この階層へ出発（テスト）</button>
        </div>
        <div class="test-foot">
          <button type="button" id="testWipe" class="btn danger">データを消してキャラクリからやり直す</button>
        </div>
      </details>
    </div>
  </div>

  <div id="choose" hidden>
    <div class="panel">
      <h2 id="chooseTitle"></h2>
      <p id="chooseLead"></p>
      <div id="chooseList"></div>
    </div>
  </div>
</div>

<script src="js/game/input.js?v=15"></script>
<script src="js/game/render.js?v=15"></script>
<script src="js/game/world.js?v=15"></script>
<script src="js/game/rooms.js?v=15"></script>
<script src="js/game/dungeon.js?v=15"></script>
<script src="js/game/loot.js?v=15"></script>
<script src="js/game/data.js?v=15"></script>
<script src="js/game/state.js?v=15"></script>
<script src="js/game/faces.js?v=15"></script>
<script src="js/game/battle.js?v=15"></script>
<script src="js/game/enemies.js?v=15"></script>
<script src="js/game/bosses.js?v=15"></script>
<script src="js/game/party.js?v=15"></script>
<script src="js/game/skills.js?v=15"></script>
<script src="js/game/town.js?v=15"></script>
<script src="js/game/base.js?v=15"></script>
<script src="js/game/core.js?v=15"></script>
</body>
</html>
